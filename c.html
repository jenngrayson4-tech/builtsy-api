<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--accent:#4361EE;--accent-soft:rgba(67,97,238,0.1);--border:#e8e8ec;--text:#111;--text2:#555;--bg:#f5f5f7;}
html,body{min-height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);}
body.has-bg{background:transparent!important;}
body.has-bg .input-bar{background:rgba(255,255,255,0.7);backdrop-filter:blur(20px);}
body.has-bg .msg-row.bot .msg-bubble{background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);}
body.has-bg .link-pill{background:rgba(255,255,255,0.75);backdrop-filter:blur(8px);}
body.has-bg .suggest-chip{background:rgba(255,255,255,0.75);backdrop-filter:blur(8px);}
body.has-bg .profile{background:transparent;}
body.has-bg .links-section{background:rgba(255,255,255,0.45);backdrop-filter:blur(12px);}

.page{max-width:480px;margin:0 auto;padding-bottom:96px;display:flex;flex-direction:column;align-items:center;}

/* loading / error */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;padding:24px;text-align:center;}
.loader-spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* bg */
.bg-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;background-repeat:no-repeat;}
.bg-overlay{position:fixed;inset:0;z-index:-1;}

/* profile */
.profile{width:100%;padding:40px 24px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.profile-photo-wrap{position:relative;width:100px;height:100px;margin-bottom:4px;}
.profile-photo{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid white;box-shadow:0 4px 20px rgba(0,0,0,.15);}
.profile-emoji{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;border:3px solid white;box-shadow:0 4px 20px rgba(0,0,0,.12);}
.online-dot{position:absolute;bottom:5px;right:5px;width:16px;height:16px;background:#22c55e;border-radius:50%;border:2.5px solid white;}
.profile-name{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;}
.profile-status{font-size:.72rem;font-weight:600;color:#22c55e;letter-spacing:.04em;text-transform:uppercase;}
.profile-bio{font-size:.9rem;color:var(--text2);line-height:1.7;max-width:300px;font-weight:400;}

/* links — lives below chat now */
.links-section{width:100%;padding:8px 20px 16px;display:flex;flex-direction:column;gap:9px;}
.links-heading{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);font-family:'DM Mono',monospace;text-align:center;padding:12px 0 4px;opacity:.7;}
.link-pill{display:block;width:100%;padding:12px 20px;border-radius:100px;text-align:center;text-decoration:none;font-size:.875rem;font-weight:600;font-family:'DM Sans',sans-serif;transition:filter .15s,transform .1s;cursor:pointer;background:white;border:1.5px solid var(--border);}
.link-pill:hover{filter:brightness(1.04);transform:translateY(-1px);border-color:var(--accent);}

/* chat */
.chat-section{width:100%;padding:4px 14px 0;display:flex;flex-direction:column;gap:12px;}
.msg-row{display:flex;gap:8px;align-items:flex-end;}
.msg-row.user{justify-content:flex-end;}
.msg-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;overflow:hidden;}
.msg-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.msg-content{display:flex;flex-direction:column;gap:3px;max-width:300px;}
.msg-bubble{padding:11px 15px;border-radius:18px;font-size:.875rem;line-height:1.6;word-break:break-word;}
.msg-row.bot .msg-bubble{background:white;color:var(--text);border-radius:4px 18px 18px 18px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.msg-row.user .msg-bubble{color:white;border-radius:18px 18px 4px 18px;}
.msg-time{font-size:.62rem;color:#bbb;padding:0 4px;}
.msg-row.user .msg-time{text-align:right;}
.msg-link{color:inherit;text-decoration:underline;opacity:.85;}
.msg-typing{display:flex;gap:4px;align-items:center;}
.msg-typing span{width:6px;height:6px;border-radius:50%;background:#ccc;animation:typeDot 1.2s infinite;}
.msg-typing span:nth-child(2){animation-delay:.2s;}
.msg-typing span:nth-child(3){animation-delay:.4s;}
@keyframes typeDot{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}

/* chips */
.suggest-wrap{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px 4px;transition:opacity .2s;}
.suggest-wrap.hidden{opacity:0;pointer-events:none;}
.suggest-chip{background:white;border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;font-size:.8rem;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s;box-shadow:0 1px 4px rgba(0,0,0,.05);font-family:'DM Sans',sans-serif;text-align:left;line-height:1.4;}
.suggest-chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08);}

/* footer */
.ai-disclaimer{font-size:.65rem;color:#ccc;font-family:'DM Mono',monospace;padding:10px 0 2px;text-align:center;}
.made-with{width:100%;text-align:center;padding:10px 20px 16px;}
.made-with-love{font-family:'DM Mono',monospace;font-size:.65rem;color:#ccc;letter-spacing:.04em;}
.made-with-love strong{color:#ee70bc;font-weight:600;}
.made-with-love a{color:inherit;text-decoration:none;}
.made-with-love a:hover{color:#aaa;}

/* input bar */
.input-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(245,245,247,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:10px 16px 18px;display:flex;gap:10px;align-items:center;z-index:100;}
.chat-input{flex:1;border:1.5px solid var(--border);border-radius:24px;padding:12px 18px;font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none;background:white;transition:border-color .2s,box-shadow .2s;color:var(--text);}
.chat-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.chat-input::placeholder{color:#bbb;}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;color:white;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:filter .15s,transform .1s;box-shadow:0 4px 12px rgba(0,0,0,.18);}
.send-btn:hover{filter:brightness(1.1);}
.send-btn:active{transform:scale(.93);}
.send-btn:disabled{opacity:.5;cursor:not-allowed;}
.send-btn svg{width:18px;height:18px;fill:white;}

/* ── social icons ── */
.social-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:2px 0 10px;}
.social-btn{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all .2s;flex-shrink:0;color:var(--text2);}
.social-btn:hover{background:var(--accent);color:white;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15);}
.social-btn svg{width:16px;height:16px;}
body.has-bg .social-btn{background:rgba(255,255,255,.75);backdrop-filter:blur(8px);}

/* ── feel: playful ── */
body.feel-playful .msg-row.bot .msg-bubble{border-radius:4px 22px 22px 22px;}
body.feel-playful .suggest-chip{box-shadow:0 2px 10px rgba(0,0,0,.07);}
body.feel-playful .profile-name{font-size:1.6rem;}
body.feel-playful .link-pill{border-radius:18px;}
body.feel-playful .send-btn{border-radius:14px;}
/* ── feel: organic ── */
body.feel-organic:not(.has-bg){background:#faf6f1!important;}
body.feel-organic .msg-row.bot .msg-bubble{background:#fdf9f5;}
body.feel-organic .suggest-chip{background:#fdf9f5;border-color:#e5d8cc;}
body.feel-organic .chat-input{background:#fdf9f5;border-color:#e5d8cc;}
body.feel-organic .link-pill{background:#fdf9f5;border-color:#e5d8cc;}
/* ── feel: bold ── */
body.feel-bold .profile-name{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;}
body.feel-bold .msg-bubble{font-weight:500;}
body.feel-bold .suggest-chip{font-weight:700;border-width:2px;}
body.feel-bold .link-pill{font-weight:700;letter-spacing:-.01em;}
body.feel-bold .input-bar{border-top-width:2px;}
/* ── feel: dreamy ── */
body.feel-dreamy .chat-section{gap:16px;}
body.feel-dreamy .profile{padding-top:56px;gap:12px;}
body.feel-dreamy .msg-row.bot .msg-bubble{box-shadow:0 6px 28px rgba(0,0,0,.07);}
body.feel-dreamy .suggest-chip{box-shadow:0 3px 16px rgba(0,0,0,.06);border-color:rgba(0,0,0,.06);}
body.feel-dreamy .profile-photo,.feel-dreamy .profile-emoji{box-shadow:0 8px 32px rgba(0,0,0,.15);}
/* ── feel: modern ── */
body.feel-modern .msg-row.bot .msg-bubble{border-radius:4px 12px 12px 12px;}
body.feel-modern .msg-row.user .msg-bubble{border-radius:12px 12px 4px 12px;}
body.feel-modern .suggest-chip{border-radius:8px;font-size:.76rem;letter-spacing:.02em;}
body.feel-modern .link-pill{border-radius:10px;letter-spacing:.01em;}
body.feel-modern .chat-input{border-radius:12px;}
body.feel-modern .send-btn{border-radius:12px;}
body.feel-modern .profile-name{letter-spacing:-.03em;}
</style>
</head>
<body>

<div class="loader" id="loader"><div class="loader-spinner"></div></div>

<div class="loader" id="error-state" style="display:none;">
  <div style="font-size:2.5rem;">🤔</div>
  <div style="font-size:1.1rem;font-weight:700;">Bot not found</div>
  <div style="font-size:.85rem;color:var(--text2);max-width:280px;line-height:1.6;" id="error-msg">This link doesn't seem to work.</div>
  <a href="https://builtsy.ai" style="margin-top:8px;font-size:.82rem;color:var(--accent);font-weight:600;">builtsy.ai</a>
</div>

<div class="bg-layer" id="bg-layer"></div>
<div class="bg-overlay" id="bg-overlay"></div>

<div class="page" id="main-page" style="display:none;">
  <div class="profile">
    <div class="profile-photo-wrap">
      <div class="profile-emoji" id="profile-emoji" style="display:none;"></div>
      <img class="profile-photo" id="profile-photo" src="" alt="" style="display:none;">
      <div class="online-dot"></div>
    </div>
    <div class="profile-name" id="profile-name"></div>
    <div class="profile-status">Online now</div>
    <div class="profile-bio" id="profile-bio" style="display:none;"></div>
    <div class="social-row" id="social-row" style="display:none;"></div>
  </div>

  <div class="chat-section" id="chat-msgs"></div>
  <div class="suggest-wrap hidden" id="suggest-wrap"></div>

  <div class="ai-disclaimer">AI responses may not always be accurate.</div>

  <div class="links-section" id="links-section" style="display:none;">
    <div class="links-heading" id="links-heading">quick links</div>
  </div>

  <div class="made-with">
    <div class="made-with-love">made with <a href="https://builtsy.ai" target="_blank" rel="noopener">builtsy.ai</a> ✦ with love for <strong id="made-with-name">you</strong> 🌸</div>
  </div>
</div>

<div class="input-bar" id="input-bar" style="display:none;">
  <input class="chat-input" id="chat-input" type="text" placeholder="Ask anything…"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}">
  <button class="send-btn" id="send-btn" onclick="sendMsg()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
var SUPABASE_URL = 'https://nukcbqlxxrfsgchqyxud.supabase.co';
var SUPABASE_KEY = 'sb_publishable_UDXeGe2ngBJsj_lwYkRF1A_igvEU6nX';
var _sb=null,_bot=null,_msgs=[],_busy=false;
var _SESSION_LIMIT=10,_userMsgCount=0;

try{_sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){}

(function(){
  var slug=(new URLSearchParams(window.location.search).get('u')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
  if(!slug)return showError('No handle in URL.');
  loadBot(slug);
})();

async function loadBot(slug){
  try{
    if(!_sb)throw new Error('Client not ready');
    var{data:row,error}=await _sb.from('saves').select('data').eq('blueprint_type','chatbot').filter('data->>slug','eq',slug).maybeSingle();
    if(error)throw new Error(error.message);
    if(!row||!row.data)return showError('Bot not found — this creator hasn\'t published their bot yet.');
    var d=row.data;
    _bot={
      bot_name:d.botName||'',about:d.about||'',services:d.services||'',hours:d.hours||'',
      location:d.location||'',pricing:d.pricing||'',how_to_order:d.howToOrder||'',
      policies:d.policies||'',extra_info:d.extraInfo||'',
      greeting:d.greeting||'Hey! Ask me anything 👋',avatar_emoji:d.avatarEmoji||'✨',
      accent_color:d.accentColor||'#4361EE',links:d.links||[],faqs:d.faqs||[],
      tone:d.tone||'friendly',avoid_topics:d.avoidTopics||'',
      fallback_message:d.fallbackMessage||'',slug:d.slug||slug,
      phone:d.phone||'',email:d.email||'',booking_url:d.bookingUrl||'',
      sms_message:d.smsMessage||'',profile_photo:d.profilePhoto||'',
      bg_image:d.bgImage||'',bg_color:d.bgColor||'',tagline:d.tagline||'',
      social_links:d.socialLinks||[],feel:d.feel||''
    };
    renderPage();
  }catch(e){showError('Could not load bot — check your connection.');}
}

function renderPage(){
  var bot=_bot,accent=bot.accent_color||'#4361EE';
  document.documentElement.style.setProperty('--accent',accent);
  document.documentElement.style.setProperty('--accent-soft',ha(accent,.12));
  document.getElementById('send-btn').style.background=accent;
  document.title=bot.bot_name||'Chat';

  if(bot.bg_image){
    document.body.classList.add('has-bg');
    document.getElementById('bg-layer').style.backgroundImage='url('+bot.bg_image+')';
    document.getElementById('bg-overlay').style.background='rgba(255,255,255,0.52)';
  } else if(bot.bg_color){
    document.getElementById('bg-layer').style.background=bot.bg_color;
    document.getElementById('bg-overlay').style.background='transparent';
  } else {
    document.getElementById('bg-overlay').style.background='transparent';
  }

  if(bot.profile_photo){
    var im=document.getElementById('profile-photo');im.src=bot.profile_photo;im.style.display='';
  }else{
    var em=document.getElementById('profile-emoji');
    em.textContent=bot.avatar_emoji||'✨';em.style.display='flex';
    em.style.background=ha(accent,.1);em.style.borderColor=ha(accent,.25);
  }

  document.getElementById('profile-name').textContent=bot.bot_name||'';

  var bio=bot.tagline||(bot.about?bot.about.split('\n')[0].slice(0,140).trim():'');
  if(bio){var b=document.getElementById('profile-bio');b.textContent=bio;b.style.display='';}

  if(bot.links&&bot.links.length){
    var sec=document.getElementById('links-section');
    bot.links.forEach(function(l){
      if(!l.label)return;
      var a=document.createElement('a');
      a.className='link-pill';
      a.style.color=accent;
      a.href=l.url||'#';a.target='_blank';a.rel='noopener';
      a.textContent=l.label;sec.appendChild(a);
    });
    sec.style.display='';
  }

  document.getElementById('made-with-name').textContent=bot.bot_name||'you';

  // Feel
  if(bot.feel&&bot.feel!=='clean') document.body.classList.add('feel-'+bot.feel);

  // Social icons
  if(bot.social_links&&bot.social_links.length){
    var sr=document.getElementById('social-row');
    bot.social_links.forEach(function(s){
      if(!s.url||!s.platform||!_SOCIAL_SVGS[s.platform])return;
      var a=document.createElement('a');
      a.className='social-btn';a.href=s.url;a.target='_blank';a.rel='noopener';
      a.setAttribute('aria-label',s.platform);a.innerHTML=_SOCIAL_SVGS[s.platform];
      sr.appendChild(a);
    });
    if(sr.children.length)sr.style.display='';
  }

  document.getElementById('loader').style.display='none';
  document.getElementById('main-page').style.display='';
  document.getElementById('input-bar').style.display='flex';

  var greeting=bot.greeting||'Hey! Ask me anything 👋';
  appendBotMsg(greeting);
  _msgs.push({role:'assistant',content:greeting});
  setTimeout(function(){document.getElementById('chat-input').focus();},300);
  setTimeout(generateSuggestions,900);
}

function showError(msg){
  document.getElementById('loader').style.display='none';
  document.getElementById('error-msg').textContent=msg;
  document.getElementById('error-state').style.display='';
}

async function sendMsg(){
  if(_busy)return;
  var inp=document.getElementById('chat-input'),text=inp.value.trim();
  if(!text)return;
  // Session cap
  if(_userMsgCount>=_SESSION_LIMIT){
    showSessionLimit();return;
  }
  inp.value='';
  if(isBlocked(text)){appendUserMsg(text);setTimeout(function(){appendBotMsg('That\'s not something I can help with here. 😊');},400);return;}
  _userMsgCount++;
  hideChips();appendUserMsg(text);_msgs.push({role:'user',content:text});
  _busy=true;document.getElementById('send-btn').disabled=true;
  var typing=showTyping();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  try{
    var r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:_msgs,system:buildSystemPrompt(_bot)})});
    var json=await r.json();typing.remove();
    var reply=json.text||json.error||'Sorry, something went wrong.';
    appendBotMsg(reply);_msgs.push({role:'assistant',content:reply});
    if(_msgs.length>20)_msgs=_msgs.slice(-20);
  }catch(e){typing.remove();appendBotMsg('Sorry, something went wrong. Try again.');}
  _busy=false;document.getElementById('send-btn').disabled=false;
  document.getElementById('chat-input').focus();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function getTime(){var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+(m<10?'0':'')+m+' '+ap;}

function appendUserMsg(text){
  var msgs=document.getElementById('chat-msgs'),row=document.createElement('div');
  row.className='msg-row user';
  row.innerHTML='<div class="msg-content"><div class="msg-bubble" style="background:'+(_bot.accent_color||'#4361EE')+';">'+esc(text)+'</div><div class="msg-time">'+getTime()+'</div></div>';
  msgs.appendChild(row);
}

function botAv(){
  var b=_bot||{},ac=b.accent_color||'#4361EE';
  if(b.profile_photo)return '<div class="msg-av"><img src="'+b.profile_photo+'" alt=""></div>';
  return '<div class="msg-av" style="background:'+ha(ac,.1)+';">'+(b.avatar_emoji||'✨')+'</div>';
}

function appendBotMsg(text){
  var msgs=document.getElementById('chat-msgs'),bot=_bot||{},accent=bot.accent_color||'#4361EE';
  var contact=text.indexOf('[CONTACT_CARD]')!==-1;
  text=text.replace(/\[CONTACT_CARD\]/g,'').trim();
  var safe=esc(text).replace(/(https?:\/\/[^\s&lt;&gt;"]+)/g,'<a class="msg-link" href="$1" target="_blank" rel="noopener">$1</a>');
  var row=document.createElement('div');row.className='msg-row bot';
  row.innerHTML=botAv()+'<div class="msg-content"><div class="msg-bubble">'+safe+'</div><div class="msg-time">'+getTime()+'</div></div>';
  msgs.appendChild(row);
  if(contact&&(bot.phone||bot.email||bot.booking_url)){
    var sms=bot.sms_message||'Hi! I just chatted with your AI 👋';
    var card=document.createElement('div');card.style.cssText='margin-left:38px;margin-top:4px;display:flex;flex-wrap:wrap;gap:7px;';
    if(bot.phone){var s=document.createElement('a');s.href='sms:'+bot.phone+'?body='+encodeURIComponent(sms);s.style.cssText='display:inline-flex;align-items:center;padding:8px 16px;border-radius:100px;font-size:.8rem;font-weight:700;text-decoration:none;background:'+accent+';color:white;font-family:\'DM Sans\',sans-serif;';s.textContent='📲 Text me';card.appendChild(s);}
    if(bot.email){var e=document.createElement('a');e.href='mailto:'+bot.email;e.style.cssText='display:inline-flex;align-items:center;padding:8px 16px;border-radius:100px;font-size:.8rem;font-weight:700;text-decoration:none;background:white;color:'+accent+';border:1.5px solid '+accent+';font-family:\'DM Sans\',sans-serif;';e.textContent='📧 Email';card.appendChild(e);}
    if(bot.booking_url){var bk=document.createElement('a');bk.href=bot.booking_url;bk.target='_blank';bk.style.cssText='display:inline-flex;align-items:center;padding:8px 16px;border-radius:100px;font-size:.8rem;font-weight:700;text-decoration:none;background:white;color:'+accent+';border:1.5px solid '+accent+';font-family:\'DM Sans\',sans-serif;';bk.textContent='📅 Book now';card.appendChild(bk);}
    msgs.appendChild(card);
  }
}

function showTyping(){
  var bot=_bot||{},ac=bot.accent_color||'#4361EE',msgs=document.getElementById('chat-msgs');
  var row=document.createElement('div');row.className='msg-row bot';
  row.innerHTML=botAv()+'<div class="msg-content"><div class="msg-bubble"><div class="msg-typing"><span></span><span></span><span></span></div></div></div>';
  msgs.appendChild(row);return row;
}

var _BLOCKED=[/\bsex\b/i,/\bporn/i,/\bnude\b/i,/\bexplicit\b/i,/\berotic/i,/\bjailbreak\b/i,/\bignore (your|all|previous) instructions?\b/i];
function isBlocked(text){
  for(var i=0;i<_BLOCKED.length;i++){if(_BLOCKED[i].test(text))return true;}
  if(_bot&&_bot.avoid_topics){var ts=_bot.avoid_topics.split(/[,\n]+/).map(function(t){return t.trim().toLowerCase();}).filter(Boolean),lo=text.toLowerCase();for(var j=0;j<ts.length;j++){if(ts[j].length>2&&lo.indexOf(ts[j])!==-1)return true;}}
  return false;
}

function buildSystemPrompt(bot){
  var parts=[
    'You are '+(bot.bot_name||'an AI assistant')+', a Builtsy AI assistant. You are an AI — say so if sincerely asked.',
    'TRUTH FIRST: Only state what you know from the info below. Never invent facts, prices, or credentials.',
    bot.about?'## About\n'+bot.about:'',
    bot.services?'## Services\n'+bot.services:'',
    bot.hours?'## Hours\n'+bot.hours:'',
    bot.location?'## Location\n'+bot.location:'',
    bot.pricing?'## Pricing\n'+bot.pricing:'',
    bot.how_to_order?'## How to Book\n'+bot.how_to_order:'',
    bot.policies?'## Policies\n'+bot.policies:'',
    bot.extra_info?'## More Info\n'+bot.extra_info:'',
    (bot.faqs&&bot.faqs.length)?'## FAQs\n'+bot.faqs.map(function(f){return 'Q: '+f.q+'\nA: '+f.a;}).join('\n'):'',
    (bot.links&&bot.links.length)?'## Links\n'+bot.links.map(function(l){return l.label+': '+l.url;}).join('\n'):'',
    bot.tone?'## Tone\nBe '+bot.tone+'.':'',
    bot.avoid_topics?'## Never discuss\n'+bot.avoid_topics:'',
    bot.fallback_message?'## When you don\'t know\nSay: "'+bot.fallback_message+'"':'',
    '## Safety\nNo legal, medical, financial, or mental health advice.'
  ];
  var contacts=[];
  if(bot.phone)contacts.push('Phone: '+bot.phone);
  if(bot.email)contacts.push('Email: '+bot.email);
  if(bot.booking_url)contacts.push('Booking: '+bot.booking_url);
  if(contacts.length)parts.push('## Contact\n'+contacts.join('\n')+'\n\nWhen someone wants to connect — answer then add [CONTACT_CARD] on its own line.');
  return parts.filter(Boolean).join('\n\n');
}

var _chipsShown=false;
async function generateSuggestions(){
  try{
    var sys='Generate exactly 4 curiosity-evoking, personality-driven conversation starters for this chatbot. Make each one specific and intriguing — the kind of question that makes a visitor think "I have to know that." Use the person\'s actual story, background, and expertise. Under 10 words each. Examples of the right style: "How did you build a startup without funding?", "What\'s your biggest business lesson?", "How do you write a children\'s book?". Return ONLY a JSON array of 4 strings, no markdown.\n\n'+buildSystemPrompt(_bot);
    var r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:'Give me 4 starter chips.'}],system:sys})});
    var json=await r.json();
    var raw=(json.text||'').trim().replace(/^```json?\n?/i,'').replace(/\n?```$/,'').trim();
    var chips=JSON.parse(raw);
    if(Array.isArray(chips)&&chips.length)renderChips(chips);
  }catch(e){}
}

function renderChips(chips){
  var wrap=document.getElementById('suggest-wrap');if(!wrap)return;
  wrap.innerHTML='';
  chips.forEach(function(text){
    var btn=document.createElement('button');btn.className='suggest-chip';btn.textContent=text;
    btn.onclick=function(){hideChips();document.getElementById('chat-input').value=text;sendMsg();};
    wrap.appendChild(btn);
  });
  wrap.classList.remove('hidden');_chipsShown=true;
}

function hideChips(){
  if(!_chipsShown)return;
  var w=document.getElementById('suggest-wrap');if(w)w.classList.add('hidden');_chipsShown=false;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ha(hex,a){try{var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}catch(e){return 'rgba(67,97,238,'+a+')';}}
